# Header links, in order. A link is marked current on pages whose URL contains
# `match`, or on every page of `collection`.

main:
  - title: "Publications"
    url: /publications/
    match: /publication

  - title: "Talks"
    url: /talks/
    match: /talks/

  - title: "Teaching"
    url: /teaching/
    match: /teaching/

  - title: "News"
    url: /year-archive/
    match: /year-archive/
    collection: posts

  - title: "CV"
    url: /cv-json/
    match: /cv
