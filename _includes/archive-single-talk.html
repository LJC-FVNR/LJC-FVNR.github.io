<div class="row">
  <div class="what">
    <a class="title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <p class="sub">{{ post.type | default: post.talk_type }}, {{ post.venue }}</p>
    {% if post.excerpt %}<p class="detail">{{ post.excerpt | strip_html | strip }}</p>{% endif %}
  </div>
  <time class="when" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %-d, %Y' }}</time>
</div>
