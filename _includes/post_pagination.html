{% if page.previous or page.next %}
<nav class="pager" aria-label="More news">
  {% if page.previous %}<a class="prev" href="{{ page.previous.url | relative_url }}">Older: {{ page.previous.title }}</a>{% endif %}
  {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}">Newer: {{ page.next.title }}</a>{% endif %}
</nav>
{% endif %}
